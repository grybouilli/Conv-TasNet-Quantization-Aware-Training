# https://packaging.python.org/en/latest/
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatorch"
version = "1.0.0"
description = "Hardware Aware PyTorch"
requires-python = ">=3.13"
authors = [
  { name = "Bastien Barbe", email = "bastien.barbe@insa-lyon.fr" },
  { name = "Romain Bouarah", email = "romain.bouarah@insa-lyon.fr" },
]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "matplotlib>=3.10.7",
  #"numpy>=2.3.5",
  #"tensorboard>=2.20.0",
  #"tqdm>=4.67.1",
  "pytorchcv>=0.0.73",
  #"torchvision==0.24.1",
  #"torch==2.10.0",
  "torchvision==0.25.0",
]

[tool.ty.environment]
root = ["./src"]